<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agenda de Contactos</title>
<link rel="stylesheet" href="style-agenda.css">
<script src="agenda.js"></script>
</head>
<body>

<script src="../sesion/sesión.js"></script>


<script>
window.onload=function(){
    let usuario=JSON.parse(localStorage.getItem("sesionActiva"));
    if(!usuario){window.location.href="../login/Login.html";}
}
</script>

<div class="header">
    <h1>AGENDA DE CONTACTOS</h1>
    <div class="search-globe">
        <input type="text" id="buscador" placeholder="🔍 Buscar..." onkeyup="buscarContacto()">
    </div>
</div>

<div class="container">
    <div class="tabs">
        <button class="active" onclick="mostrarLista()">Ver Contactos</button>
        <button onclick="mostrarFormulario()">Añadir Contacto</button>
    </div>
    <div class="filters">
        <label for="filtroCategoria">Filtrar por categoría:</label>
        <select id="filtroCategoria" onchange="filtrarPorCategoria()"></select>
        <label for="ordenar">Ordenar:</label>
        <select id="ordenar" onchange="ordenar()">
            <option value="">Ninguno</option>
            <option value="nombre-az">Nombre A-Z</option>
            <option value="nombre-za">Nombre Z-A</option>
            <option value="recientes">Más recientes</option>
            <option value="modificados">Modificados recientemente</option>
        </select>
    </div>
    <div id="listaContactos"></div>
    <div class="modal" id="modalFormulario">
        <div class="modal-content">
            <h3 id="tituloFormulario">Añadir Contacto</h3>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" placeholder="">
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" placeholder="">
            <label for="correo">Correo:</label>
            <input type="email" id="correo" placeholder="">
            <label for="categoria">Categoría:</label>
            <input type="text" id="categoria" list="categorias" placeholder="">
            <datalist id="categorias">
                <option value="Familia">
                <option value="Amig@">
                <option value="Maestr@">
            </datalist>
            <button onclick="cerrarModal()">Cancelar</button>
            <button id="btnGuardar" onclick="guardarContacto()">Guardar Contacto</button>
        </div>
    </div>
</div>

<div class="floating-buttons">
    <button onclick="location.href='../menu/menu.html'" title="Menú">🏠</button>
    <button onclick="location.href='MiCuenta.html'" title="Mi Cuenta">👤</button>
    <button onclick="cerrarSesion()" title="Cerrar Sesión">🚪</button>
</div>
</body>
</html>
